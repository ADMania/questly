services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-questly}
      POSTGRES_USER: ${POSTGRES_USER:-questly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-questly}
    ports:
      - "5432:5432"
    volumes:
      - questly-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-questly} -d ${POSTGRES_DB:-questly}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-questly}:${POSTGRES_PASSWORD:-questly}@postgres:5432/${POSTGRES_DB:-questly}
      DATABASE_DIALECT: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"

volumes:
  questly-db-data:
